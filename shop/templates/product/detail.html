{% extends 'base.html' %}
{%block title %} {{product.name}}{% endblock%}
{% block content%}
<div class="card m-5" style="max-width: 90%;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{product.image.url}}" class="img-fluid rounded-start" alt="{{product.name}}">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{product.name}}</h5>
        <h6><a href="{{product.category.get_absolute_url}}">{{product.category.name}}</a></h6>
        <h6 class="card-text">{{product.price}}</h6>
        <p class="card-text">{{product.description}}</p>
        <p class="card-text"><small class="text-muted">{{product.created}}/small></p>
        <p class="card-text"><small class="text-muted">{{product.updated}}/small></p>

      </div>
    </div>
  </div>
</div>

{% endblock %}
