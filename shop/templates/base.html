{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="shortcut icon" type="image/png" href="{% static 'images/coffee.png' %}">
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous">

        <title>{%block title %} {% endblock%}</title>
    </head>
    <body>
        <!-- navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <!-- Logo and Brand -->
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="{% static 'images/coffee.png' %}"
                 alt="Logo" width="50" height="50"
                 class="d-inline-block align-text-top me-2">
            <span class="fw-bold fs-4 text-dark">Coffee Shop</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarMain" aria-controls="navbarMain" 
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" href="{% url 'shop:product_list' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="{% url 'shop:product_list' %}">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="#">About Us</a>
                </li>

                <!-- Shopping Cart Icon with Badge -->
                <li class="nav-item ms-lg-3">
                    <a class="btn  position-relative d-flex align-items-center px-3 fw-bold" 
                       href="{% url 'cart:cart_detail' %}" data-bs-toggle="modal" data-bs-target="#cartModal">
                        <!-- اگر از Bootstrap Icons استفاده می‌کنید -->
                        
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart text-danger" viewBox="0 0 16 16">
                        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                        </svg>
                        
                        
                        {% with total_items=cart|length %}
                            {% if total_items > 0 %}
                                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                    {{ total_items}}, ${{cart.get_total_price}}
                                </span>
                            {% endif %}
                        {% endwith %}
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>


        {% block content%}
        {% endblock%}
         
        
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous"></script>

    </body>
</html>
